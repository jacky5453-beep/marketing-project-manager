<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每週工作規劃</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#C3F000;--green-light:#f0fcc8;--green-dark:#9DC200;
  --teal:#0EA882;--teal-light:#E0F7F2;
  --amber:#F59E0B;--amber-light:#FEF3C7;
  --red:#EF4444;--red-light:#FEE2E2;
  --purple:#9333EA;--purple-light:#F3E8FF;
  --bg:#FAFAF4;--surface:#FFFFFF;--surface2:#F4F5EE;
  --border:#E3E5DA;--border2:#CCCFBE;
  --text:#1A1A16;--text2:#6B6B60;--text3:#9A9A8A;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  --shadow-md:0 4px 24px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.05);
}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans','Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6;overflow-x:hidden}

/* ===== HEADER ===== */
.header{
  background:#1A1A16;
  padding:0 20px;
  height:60px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{
  width:34px;height:34px;background:var(--green);border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.header-logo svg{width:18px;height:18px}
.header-title{font-size:16px;font-weight:700;color:#fff}
.header-week{font-size:12px;color:rgba(255,255,255,.5);margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px}
.btn-add{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;
  background:var(--green);color:#1A1A16;
  border:none;border-radius:10px;
  font-size:13px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
.btn-add:hover{background:var(--green-dark);transform:translateY(-1px)}
.btn-add svg{width:14px;height:14px}

/* ===== PROGRESS BAR ===== */
.progress-bar-wrap{
  background:#1A1A16;
  padding:0 20px 12px;
  display:flex;align-items:center;gap:10px;
}
.progress-label{font-size:12px;color:rgba(255,255,255,.5);flex-shrink:0}
.progress-track{flex:1;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .4s}
.progress-count{font-size:12px;color:rgba(255,255,255,.5);flex-shrink:0}

/* ===== MAIN LAYOUT ===== */
.main{padding:20px;max-width:1400px;margin:0 auto}

/* ===== WEEK GRID ===== */
.week-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}
.day-col{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  min-height:200px;
}
.day-col.is-today{
  border-color:var(--green);
  box-shadow:0 0 0 2px rgba(195,240,0,.2);
}
.day-header{
  padding:12px 12px 8px;
  border-bottom:1px solid var(--border);
  background:var(--surface2);
}
.day-col.is-today .day-header{background:var(--green-light)}
.day-name{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.05em;text-transform:uppercase}
.day-date{font-size:20px;font-weight:700;color:var(--text);line-height:1.1;margin-top:2px}
.day-col.is-today .day-date{color:#1A1A16}
.day-done-count{font-size:11px;color:var(--text3);margin-top:2px}

.day-tasks{padding:8px;display:flex;flex-direction:column;gap:6px}
.task-card{
  border-radius:10px;
  padding:8px 10px;
  background:var(--surface2);
  border:1px solid var(--border);
  cursor:pointer;
  transition:all .15s;
  position:relative;
  user-select:none;
}
.task-card:hover{border-color:var(--border2);background:#efefea}
.task-card.done{opacity:.5}
.task-card.done .task-name{text-decoration:line-through}
.task-top{display:flex;align-items:flex-start;gap:6px}
.task-check{
  width:16px;height:16px;
  border:2px solid var(--border2);
  border-radius:4px;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.task-card.done .task-check{
  background:var(--green);border-color:var(--green-dark);
}
.task-check svg{width:10px;height:10px;stroke:#1A1A16;stroke-width:2.5;display:none}
.task-card.done .task-check svg{display:block}
.task-info{flex:1;min-width:0}
.task-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;word-break:break-all}
.task-time{font-size:11px;color:var(--text3);margin-top:2px}
.task-note{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.3;word-break:break-all}
.task-cat{
  display:inline-block;
  font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:4px;
  margin-top:4px;
}
.task-actions{
  display:none;position:absolute;top:6px;right:6px;gap:3px;
}
.task-card:hover .task-actions{display:flex}
.action-btn{
  width:22px;height:22px;border-radius:5px;border:none;
  background:var(--border);color:var(--text2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .1s;padding:0;
}
.action-btn:hover{background:var(--border2)}
.action-btn.del:hover{background:var(--red-light);color:var(--red)}
.action-btn svg{width:11px;height:11px}

.add-task-btn{
  margin:6px 8px 8px;
  display:flex;align-items:center;gap:5px;
  padding:6px 10px;
  background:transparent;color:var(--text3);
  border:1px dashed var(--border2);border-radius:8px;
  font-size:12px;font-weight:500;cursor:pointer;
  font-family:inherit;transition:all .15s;width:calc(100% - 16px);
}
.add-task-btn:hover{border-color:var(--green-dark);color:var(--green-dark);background:var(--green-light)}
.add-task-btn svg{width:12px;height:12px}

/* Empty state */
.day-empty{
  padding:16px 12px;text-align:center;
  color:var(--text3);font-size:12px;line-height:1.5;
}

/* ===== MODAL ===== */
.modal-overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:0;visibility:hidden;transition:all .2s;
}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{
  background:var(--surface);border-radius:20px;
  width:100%;max-width:480px;
  box-shadow:var(--shadow-md);
  transform:translateY(12px);transition:transform .2s;
  max-height:90vh;overflow-y:auto;
}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{
  padding:20px 20px 0;
  display:flex;align-items:center;justify-content:space-between;
}
.modal-title{font-size:17px;font-weight:700}
.modal-close{
  width:30px;height:30px;border-radius:8px;border:none;
  background:var(--surface2);color:var(--text2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.modal-close svg{width:14px;height:14px}
.modal-body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}

.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:600;color:var(--text2)}
.form-input{
  padding:10px 12px;
  border:1px solid var(--border2);border-radius:10px;
  font-size:14px;font-family:inherit;color:var(--text);
  background:var(--surface);outline:none;transition:border .15s;
}
.form-input:focus{border-color:var(--green-dark)}
.form-textarea{resize:vertical;min-height:60px;line-height:1.5}

/* Day picker */
.day-picker{display:flex;gap:6px;flex-wrap:wrap}
.day-btn{
  padding:6px 10px;border-radius:8px;
  border:1px solid var(--border2);
  background:var(--surface2);color:var(--text2);
  font-size:12px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:all .1s;
}
.day-btn.active{background:var(--green);border-color:var(--green-dark);color:#1A1A16}

/* Category picker */
.cat-picker{display:flex;gap:6px;flex-wrap:wrap}
.cat-btn{
  padding:5px 10px;border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface2);color:var(--text2);
  font-size:12px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:all .1s;
}
.cat-btn.active{color:#fff}

/* Modal footer */
.modal-footer{padding:0 20px 20px;display:flex;gap:8px;justify-content:flex-end}
.btn-cancel{
  padding:10px 18px;border-radius:10px;
  border:1px solid var(--border2);background:var(--surface2);
  color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
.btn-cancel:hover{border-color:var(--border2);background:var(--border)}
.btn-save{
  padding:10px 20px;border-radius:10px;
  border:none;background:var(--green);
  color:#1A1A16;font-size:14px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
.btn-save:hover{background:var(--green-dark)}

/* ===== MOBILE ===== */
@media(max-width:900px){
  .week-grid{grid-template-columns:1fr}
  .day-col{min-height:unset}
  .day-header{display:flex;align-items:center;gap:10px;padding:10px 12px}
  .day-name{font-size:13px}
  .day-date{font-size:15px;margin-top:0}
  .day-done-count{margin-top:0;margin-left:auto}
}
@media(max-width:480px){
  .main{padding:12px}
  .header{padding:0 14px}
  .progress-bar-wrap{padding:0 14px 10px}
  .btn-add span{display:none}
}

/* ===== TOAST ===== */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1A1A16;color:#fff;
  padding:10px 18px;border-radius:10px;
  font-size:13px;font-weight:500;
  z-index:9999;transition:transform .25s;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1A1A16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </div>
    <div>
      <div class="header-title">每週工作規劃</div>
      <div class="header-week" id="headerWeek"></div>
    </div>
  </div>
  <div class="header-right">
    <button class="btn-add" onclick="openModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>新增任務</span>
    </button>
  </div>
</div>

<!-- Progress -->
<div class="progress-bar-wrap">
  <span class="progress-label">本週完成</span>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <span class="progress-count" id="progressCount">0 / 0</span>
</div>

<!-- Main -->
<div class="main">
  <div class="week-grid" id="weekGrid"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">新增固定任務</div>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">任務名稱 *</label>
        <input type="text" class="form-input" id="inputName" placeholder="例：發電子報、上傳短影音…">
      </div>
      <div class="form-group">
        <label class="form-label">每週幾要做？（可多選）</label>
        <div class="day-picker" id="dayPicker">
          <button class="day-btn" data-day="1">週一</button>
          <button class="day-btn" data-day="2">週二</button>
          <button class="day-btn" data-day="3">週三</button>
          <button class="day-btn" data-day="4">週四</button>
          <button class="day-btn" data-day="5">週五</button>
          <button class="day-btn" data-day="6">週六</button>
          <button class="day-btn" data-day="7">週日</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">時間（選填）</label>
        <input type="time" class="form-input" id="inputTime">
      </div>
      <div class="form-group">
        <label class="form-label">類別</label>
        <div class="cat-picker" id="catPicker">
          <button class="cat-btn" data-cat="" style="border-color:var(--border2)">無</button>
          <button class="cat-btn" data-cat="行銷" data-color="#9DC200">行銷</button>
          <button class="cat-btn" data-cat="內容" data-color="#0EA882">內容</button>
          <button class="cat-btn" data-cat="電商" data-color="#F59E0B">電商</button>
          <button class="cat-btn" data-cat="行政" data-color="#6B6B60">行政</button>
          <button class="cat-btn" data-cat="其他" data-color="#9333EA">其他</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">備註（選填）</label>
        <textarea class="form-input form-textarea" id="inputNote" placeholder="補充說明、連結、注意事項…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveTask()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DAYS = ['週一','週二','週三','週四','週五','週六','週日'];
const STORAGE_TASKS = 'weekly-plan-tasks';
const STORAGE_DONE_PREFIX = 'weekly-plan-done-';

let tasks = [];
let editingId = null;
let selectedDays = [];
let selectedCat = '';
let selectedColor = '';

// ===== 資料 =====
function loadTasks() {
  try { tasks = JSON.parse(localStorage.getItem(STORAGE_TASKS)) || []; }
  catch { tasks = []; }
}
function saveTasks() {
  localStorage.setItem(STORAGE_TASKS, JSON.stringify(tasks));
}

function getMondayKey(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay(); // 0=Sun
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getDoneKey() {
  return STORAGE_DONE_PREFIX + getMondayKey(new Date());
}
function loadDone() {
  try { return JSON.parse(localStorage.getItem(getDoneKey())) || {}; }
  catch { return {}; }
}
function saveDone(done) {
  localStorage.setItem(getDoneKey(), JSON.stringify(done));
}

// ===== 週日期計算 =====
function getWeekDates() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const day = today.getDay(); // 0=Sun
  const mondayOffset = day === 0 ? -6 : 1 - day;
  const monday = new Date(today);
  monday.setDate(today.getDate() + mondayOffset);
  return Array.from({length:7}, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

// 將 JS getDay() 轉為 1~7（週一~週日）
function jsDay2Week(jsDay) {
  return jsDay === 0 ? 7 : jsDay;
}

// ===== 渲染 =====
function render() {
  const dates = getWeekDates();
  const today = new Date(); today.setHours(0,0,0,0);
  const done = loadDone();
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';

  let totalToday = 0, doneToday = 0;
  const weekDay = jsDay2Week(today.getDay());

  // 計算本週總任務與完成
  let weekTotal = 0, weekDone = 0;

  dates.forEach((date, i) => {
    const dayNum = i + 1; // 1=週一 … 7=週日
    const isToday = date.getTime() === today.getTime();
    const dayTasks = tasks.filter(t => t.days.includes(dayNum));

    const doneTasks = dayTasks.filter(t => done[t.id + '-' + dayNum]);
    weekTotal += dayTasks.length;
    weekDone += doneTasks.length;

    const col = document.createElement('div');
    col.className = 'day-col' + (isToday ? ' is-today' : '');

    const m = String(date.getMonth()+1).padStart(2,'0');
    const d = String(date.getDate()).padStart(2,'0');

    col.innerHTML = `
      <div class="day-header">
        <div>
          <div class="day-name">${DAYS[i]}</div>
          <div class="day-date">${m}/${d}</div>
        </div>
        <div class="day-done-count">${doneTasks.length}/${dayTasks.length}</div>
      </div>
      <div class="day-tasks" id="tasks-${dayNum}">
        ${dayTasks.length === 0
          ? `<div class="day-empty">還沒有任務<br>點下方 ＋ 新增</div>`
          : dayTasks.map(t => renderTask(t, dayNum, done)).join('')}
      </div>
      <button class="add-task-btn" onclick="openModal(${dayNum})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新增任務
      </button>
    `;
    grid.appendChild(col);
  });

  // 進度條
  const pct = weekTotal ? Math.round(weekDone / weekTotal * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = `${weekDone} / ${weekTotal}`;

  // header 週期
  const d0 = dates[0], d6 = dates[6];
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  document.getElementById('headerWeek').textContent = `${fmt(d0)} — ${fmt(d6)}`;
}

function renderTask(t, dayNum, done) {
  const key = t.id + '-' + dayNum;
  const isDone = !!done[key];
  const catStyle = t.cat ? `background:${hexToRgba(t.color,0.15)};color:${t.color}` : '';
  return `
    <div class="task-card ${isDone ? 'done' : ''}" onclick="toggleDone('${t.id}',${dayNum})">
      <div class="task-top">
        <div class="task-check">
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="1.5,6 4.5,9 10.5,3"/></svg>
        </div>
        <div class="task-info">
          <div class="task-name">${esc(t.name)}</div>
          ${t.time ? `<div class="task-time">⏰ ${t.time}</div>` : ''}
          ${t.note ? `<div class="task-note">${esc(t.note)}</div>` : ''}
          ${t.cat ? `<span class="task-cat" style="${catStyle}">${esc(t.cat)}</span>` : ''}
        </div>
      </div>
      <div class="task-actions" onclick="event.stopPropagation()">
        <button class="action-btn" title="編輯" onclick="openModal(${dayNum},'${t.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="action-btn del" title="刪除" onclick="deleteTask('${t.id}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/><path d="M10,11v6"/><path d="M14,11v6"/><path d="M9,6V4a1,1,0,0,1,1-1h4a1,1,0,0,1,1,1v2"/></svg>
        </button>
      </div>
    </div>
  `;
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== TOGGLE DONE =====
function toggleDone(id, dayNum) {
  const done = loadDone();
  const key = id + '-' + dayNum;
  done[key] = !done[key];
  saveDone(done);
  render();
}

// ===== DELETE =====
function deleteTask(id) {
  if (!confirm('確定要刪除這個任務嗎？')) return;
  tasks = tasks.filter(t => t.id !== id);
  saveTasks();
  render();
  showToast('已刪除任務');
}

// ===== MODAL =====
function openModal(preDay, editId) {
  editingId = editId || null;
  const modal = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent = editId ? '編輯任務' : '新增固定任務';

  // 重置
  document.getElementById('inputName').value = '';
  document.getElementById('inputTime').value = '';
  document.getElementById('inputNote').value = '';
  selectedDays = [];
  selectedCat = '';
  selectedColor = '';

  if (editId) {
    const t = tasks.find(x => x.id === editId);
    if (t) {
      document.getElementById('inputName').value = t.name;
      document.getElementById('inputTime').value = t.time || '';
      document.getElementById('inputNote').value = t.note || '';
      selectedDays = [...t.days];
      selectedCat = t.cat || '';
      selectedColor = t.color || '';
    }
  } else if (preDay) {
    selectedDays = [preDay];
  }

  updateDayBtns();
  updateCatBtns();
  modal.classList.add('open');
  setTimeout(() => document.getElementById('inputName').focus(), 200);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// Day picker
document.getElementById('dayPicker').addEventListener('click', e => {
  const btn = e.target.closest('.day-btn');
  if (!btn) return;
  const day = parseInt(btn.dataset.day);
  if (selectedDays.includes(day)) {
    selectedDays = selectedDays.filter(d => d !== day);
  } else {
    selectedDays.push(day);
  }
  updateDayBtns();
});

function updateDayBtns() {
  document.querySelectorAll('.day-btn').forEach(b => {
    b.classList.toggle('active', selectedDays.includes(parseInt(b.dataset.day)));
  });
}

// Cat picker
document.getElementById('catPicker').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  selectedCat = btn.dataset.cat;
  selectedColor = btn.dataset.color || '';
  updateCatBtns();
});

function updateCatBtns() {
  document.querySelectorAll('.cat-btn').forEach(b => {
    const isActive = b.dataset.cat === selectedCat;
    b.classList.toggle('active', isActive);
    if (isActive && b.dataset.color) {
      b.style.background = b.dataset.color;
      b.style.borderColor = b.dataset.color;
    } else {
      b.style.background = '';
      b.style.borderColor = '';
    }
  });
}

function saveTask() {
  const name = document.getElementById('inputName').value.trim();
  if (!name) { showToast('請輸入任務名稱'); return; }
  if (selectedDays.length === 0) { showToast('請至少選一天'); return; }

  const taskData = {
    name,
    days: [...selectedDays].sort(),
    time: document.getElementById('inputTime').value || '',
    cat: selectedCat,
    color: selectedColor,
    note: document.getElementById('inputNote').value.trim(),
  };

  if (editingId) {
    const idx = tasks.findIndex(t => t.id === editingId);
    if (idx !== -1) tasks[idx] = { ...tasks[idx], ...taskData };
  } else {
    tasks.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2), ...taskData });
  }

  saveTasks();
  closeModal();
  render();
  showToast(editingId ? '已更新任務' : '已新增任務 ✓');
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('open')) {
    if (e.target.tagName !== 'TEXTAREA') saveTask();
  }
});

// ===== INIT =====
loadTasks();
render();
</script>
</body>
</html>
